schema_version: "1.1"
name: corpus-01-seats
tags: [review, corpus, capability]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill, ToolSearch, AskUserQuestion, Agent, mcp__plugin_cairn_cairn__*]
  prompt: |-
    /cairn:review corpus/01-footprint-literal-scan

    The branch carries exactly one commit past its merge-base with main; the diff under review is that commit (`git diff main...corpus/01-footprint-literal-scan`). The workspace holds only the files that diff touches.
