########################################################
# npm trusted publishing (OIDC) — cairn + cairn-server #
# Registered as the trusted publisher workflow for     #
# @eventually-consistent/cairn and                     #
# @eventually-consistent/cairn-server on npmjs.com.    #
########################################################

name: publish

on:
  push:
    tags:
      # Release-shaped tags only (vX.Y.Z) — a bare "v*" also matched
      # milestone tags like v3 and fired spurious publish runs.
      # Actions filter patterns support [0-9] classes and + (one or
      # more of the preceding character), per the filter-pattern
      # cheat sheet in the workflow-syntax docs.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — this is what npm trusted publishing exchanges for auth

jobs:
  publish:
    # Stays on a GitHub-hosted runner on purpose: npm trusted publishing
    # supports GitHub-hosted runners only (docs.npmjs.com/trusted-publishers,
    # read 2026-10-16: "Self-hosted runners are not currently supported").
    runs-on: ubuntu-latest
    environment: npm-publish # matches the trusted-publisher registration on npmjs.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange.
      # Pinned exactly — an unpinned npm@latest in the release path is
      # supply-chain surface at the worst possible moment.
      - name: update npm
        run: npm install -g npm@11.5.1 && npm --version

      - name: gate — tests must pass before anything ships
        working-directory: server
        run: npm ci && npm test

      # A tagged release must never ship a stale generated surface or a
      # stale committed dist — rebuild and demand byte-identity.
      - name: gate — generated surfaces + dist freshness
        run: |
          node scripts/check-surface.mjs
          cd server && npm run build && git diff --exit-code dist

      # Tag pushes must match all three version files — both packages plus
      # the marketplace manifest — fail early and clear, not late at the
      # registry with an E403 (or a marketplace install of the wrong version).
      - name: gate — tag matches package versions
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(node -p "require('./package.json').version")" = "$v" ] || { echo "root package.json is not $v"; exit 1; }
          [ "$(node -p "require('./server/package.json').version")" = "$v" ] || { echo "server/package.json is not $v"; exit 1; }
          [ "$(node -p "require('./.claude-plugin/plugin.json').version")" = "$v" ] || { echo ".claude-plugin/plugin.json is not $v"; exit 1; }

      # Server first — the root package's cairn-setup falls back to
      # `npx @eventually-consistent/cairn-server`, so it must exist.
      # Both publishes skip when the exact version already exists, so a
      # partial-failure rerun finishes the release instead of dying on
      # "cannot publish over previously published versions".
      - name: publish @eventually-consistent/cairn-server
        working-directory: server
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@eventually-consistent/cairn-server@$v" version >/dev/null 2>&1; then
            echo "cairn-server@$v already on the registry — skipping..."
          else
            npm publish
          fi
        continue-on-error: false

      - name: publish @eventually-consistent/cairn
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@eventually-consistent/cairn@$v" version >/dev/null 2>&1; then
            echo "cairn@$v already on the registry — skipping..."
          else
            npm publish
          fi
