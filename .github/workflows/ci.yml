name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pushes to main run on the Little-CI fleet (persistent self-hosted
    # arm64 runners, org-scoped). Pull requests stay on GitHub-hosted
    # runners: this repo is public, and PR code from a fork must never
    # execute on a persistent runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'little-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-dist.mjs reasons from git history (last commit touching
          # server/dist) — a shallow clone would blind it, and it fails loudly
          # on one rather than silently passing.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: server tests
        working-directory: server
        run: |
          npm ci
          npx vitest run --exclude '**/*.live.test.ts'
          npx tsc --noEmit
      - name: surface conformance
        run: node scripts/check-surface.mjs
      # A stray hardcoded tool total outside the two sanctioned pin sites
      # survives merge-resolve passes silently — fail it here, and fail the
      # known sites when they disagree with the live registry (issue #139).
      - name: tool-count pins
        run: node scripts/check-pins.mjs
      # Everything cairn puts in front of the model before it is asked to do
      # anything — 39 command descriptions, 3 skill descriptions, the
      # session-start prose — is rent paid once per session. Nothing was
      # watching it grow (issue #211).
      - name: context footprint
        run: node scripts/check-footprint.mjs
      # Diagram labels carry counted claims ("84 typed MCP tools") that
      # drifted from the registry three times — the PNGs review fine no
      # matter what the numbers say. Detection only: the renderer lives
      # outside the repo (issue #154).
      - name: diagram-label counts
        run: node scripts/check-diagrams.mjs
      # Install-free dist staleness triage from git shape alone — names the
      # src files that moved after the last dist commit. The rebuild-and-diff
      # step below stays the authoritative gate (issue #139).
      - name: dist freshness (git shape)
        run: node scripts/check-dist.mjs
      # A half-bumped release (one version file left behind) must fail here,
      # on every push and PR — not at tag time (see issue #79).
      - name: version sync
        run: node scripts/check-versions.mjs
      # Marketplace installs run the committed dist/ — a stale build ships
      # broken no matter how green the tests are (see CRN-58).
      - name: dist freshness
        working-directory: server
        run: |
          npm run build
          git add -A dist
          if ! git diff --cached --quiet -- dist; then
            git --no-pager diff --cached --stat -- dist
            echo "dist/ is stale — run 'npm run build' in server/ and commit the result"
            exit 1
          fi
