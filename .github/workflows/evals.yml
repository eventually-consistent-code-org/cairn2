# Behavioral eval lane — ADVISORY. Runs the `claude plugin eval` suite
# (docs/EVALS.md) nightly and whenever the plugin's prose surfaces change.
# It never blocks a merge: a stochastic lane earns a blocking threshold only
# after its variance baseline exists (phase 22 constraint). The threshold
# starts at 0.7 and rises toward 1.0 as green nights accumulate.
#
# Subscription only. cairn never spawns API-key (Console-billed) sessions
# anywhere — every agent turn runs on the operator's Claude subscription —
# and this lane is no exception: it authenticates with the subscription's
# long-lived OAuth token (`claude setup-token`), the same secret the
# claude.yml / claude-code-review.yml workflows use. No ANTHROPIC_API_KEY,
# ever; an operator who exports one locally runs the suite with it unset.
#
# Two repository secrets, both owner-set, neither assumed:
#   CLAUDE_CODE_OAUTH_TOKEN — subscription auth (installed by
#                             /install-github-app; rotate with setup-token).
#   PLUGIN_EVAL_ENABLEMENT  — the early-access enablement assignment for
#                             hosts outside the per-organization rollout, as
#                             one `NAME=1` line; obtained from your Anthropic
#                             contact and never written into the repo.
name: evals

on:
  schedule:
    - cron: "17 6 * * *"          # nightly, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "commands/**"
      - "evals/**"
      - ".claude-plugin/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "skills/**"
      - "commands/**"
      - "evals/**"
      - ".claude-plugin/**"
      - ".github/workflows/evals.yml"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-evals:
    # Nightly, dispatch and push runs go to the Little-CI fleet (persistent
    # self-hosted arm64 runners, org-scoped). Pull requests stay on
    # GitHub-hosted runners: public repo, fork PR code never lands on a
    # persistent runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'little-ci' }}
    # Allowed to fail by design — see the header comment. The step's own
    # exit code (1 below threshold, 2 cost ceiling) still shows in the log
    # and the artifact carries the per-case scores.
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pinned to the release the suite was authored and proven against:
      # `plugin eval` is early access and its registration has moved between
      # builds (npm `latest` 2.1.278 reported "unknown command 'eval'" on
      # 2026-09-20). Bump deliberately, after a green local run on the new
      # version.
      - name: install claude code
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.267
          claude --version
      - name: run the suite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLUGIN_EVAL_ENABLEMENT: ${{ secrets.PLUGIN_EVAL_ENABLEMENT }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set — the lane cannot run (docs/EVALS.md, CI lane)."
            exit 1
          fi
          # belt and braces: a key in the runner env would silently re-route billing
          unset ANTHROPIC_API_KEY
          if [ -n "$PLUGIN_EVAL_ENABLEMENT" ]; then
            # one NAME=1 assignment; exporting it keeps the name out of the repo
            export "$PLUGIN_EVAL_ENABLEMENT"
          fi
          # the PATH form, from the repo root — never the plugin name
          claude plugin eval . \
            --json evals/results/ci/aggregate-result.json \
            --output-dir evals/results/ci \
            --no-publish \
            --runs 3 \
            --threshold 0.7 \
            --max-cost-usd 12
      # Per-tier verdicts (#209): regression cases must pass every run
      # (pass^k), capability cases never gate, split runs read INCONCLUSIVE.
      # ADVISORY like the rest of the lane — the regression gate becomes
      # blocking only after a variance baseline exists, a later decision.
      # Until then its exit 1 is logged, and the job stays allowed to fail.
      - name: eval verdicts
        if: always()
        run: |
          if [ ! -f evals/results/ci/aggregate-result.json ]; then
            echo "no aggregate-result.json — the suite did not produce results." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          node scripts/eval-verdicts.mjs evals/results/ci > verdicts.txt 2>&1
          rc=$?
          set -e
          cat verdicts.txt
          {
            echo "## Eval verdicts (regression gate advisory)"
            echo '```'
            cat verdicts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          path: evals/results/**
          retention-days: 14
          if-no-files-found: warn
